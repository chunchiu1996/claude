# Publishes the shop to Cloudflare Workers. Run it from GitHub: Actions → "Deploy to Cloudflare" →
# Run workflow. Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   an API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  shown on the right of your Cloudflare dashboard's Workers & Pages page
# Step-by-step guide: deploy/CLOUDFLARE-WORKERS.md
name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency: deploy-cloudflare

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the Cloudflare secrets are set
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions."
            exit 1
          else
            echo "::notice::Not publishing: the Cloudflare secrets aren't set yet (see deploy/CLOUDFLARE-WORKERS.md)."
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: steps.secrets.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v6
      - name: Test before publishing
        if: steps.secrets.outputs.ready == 'true'
        run: |
          uv venv .venv-test --python 3.12
          uv pip install --python .venv-test -r requirements-dev.txt
          .venv-test/bin/pytest -q
          SHOP_TEST_DB=durable-object .venv-test/bin/pytest -q
      - name: Create the photo bucket (first time only)
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes wrangler@4 r2 bucket create liquidatorusa-media || echo "Bucket already exists"
      - name: Publish
        if: steps.secrets.outputs.ready == 'true'
        run: uv run pywrangler deploy
