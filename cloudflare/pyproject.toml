# Python packages for the Cloudflare Workers version (uv run pywrangler deploy, from this folder).
# Docker uses ../requirements.txt instead.
[project]
name = "liquidatorusa"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0,<4",
    "openpyxl>=3.1",
    "pillow>=10",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[tool.uv]
package = false
