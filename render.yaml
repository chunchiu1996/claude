# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: liqueatorusa
    runtime: docker
    plan: starter            # ~$7/mo; a persistent disk requires a paid plan
    healthCheckPath: /
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false          # you'll be prompted for it
      - key: SITE_NAME
        value: Liqueator USA
      - key: CONTACT_EMAIL
        sync: false
      - key: CONTACT_PHONE
        sync: false
      - key: WAREHOUSE_ADDRESS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false          # optional: leave blank to take orders as pay-by-invoice
      - key: WHATSAPP_NUMBER
        sync: false          # your business WhatsApp, e.g. +1 626 555 0199
      - key: WECHAT_ID
        sync: false          # shown prominently on the Chinese seller site
      - key: SELLER_SITE_NAME
        sync: false          # name shown on the Chinese seller site (defaults to SITE_NAME)
      - key: SELLER_SITE_DOMAIN
        sync: false          # optional: serve the Chinese seller site on its own domain, e.g. partner.example.com
      - key: NOTIFY_EMAIL
        sync: false          # where new quote requests & orders are emailed (defaults to CONTACT_EMAIL)
      - key: SMTP_HOST
        sync: false          # e.g. smtp.gmail.com (optional: without SMTP, check Admin > Inquiries)
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false          # for Gmail use an App Password
